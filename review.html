<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Разметка видео ForteBank</title>
<style>
  :root { --bg:#101114; --card:#1a1c21; --line:#2a2d34; --tx:#e8e8ec; --dim:#9a9aa5; --red:#e05a5a; --grn:#4caf7d; --acc:#6aa0ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:15px/1.45 system-ui, sans-serif; }
  header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:19px; margin:0; }
  header input { background:var(--card); color:var(--tx); border:1px solid var(--line); border-radius:6px; padding:7px 10px; }
  main { padding:20px 24px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px,1fr)); gap:10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; cursor:pointer; }
  .card:hover { border-color:var(--acc); }
  .badge { display:inline-block; padding:2px 8px; border-radius:20px; font-size:12px; font-weight:600; }
  .viol { color:var(--red); background:rgba(224,90,90,.12); }
  .clean { color:var(--grn); background:rgba(76,175,125,.12); }
  .done { color:var(--acc); font-size:12px; }
  .num { color:var(--dim); font-size:12px; }
  .dupe { color:#c9a227; font-size:11px; margin-top:4px; }
  /* detail */
  #detail { display:none; }
  video { width:100%; max-width:560px; border-radius:10px; background:#000; }
  .row { display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap; }
  .col { flex:1 1 320px; }
  .strip { width:100%; height:auto; border-radius:8px; border:1px solid var(--line); }
  .ev { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; margin:10px 0; }
  .ev label { display:block; font-size:12px; color:var(--dim); margin:8px 0 3px; }
  .ev input, .ev select, .ev textarea, .bar input, .bar select {
    width:100%; background:var(--bg); color:var(--tx); border:1px solid var(--line);
    border-radius:6px; padding:6px 9px; font:14px/1.3 inherit; }
  .ev textarea { resize:vertical; min-height:44px; }
  .grid2 { display:grid; grid-template-columns:110px 1fr; gap:8px; }
  button { background:var(--acc); color:#0b1020; font-weight:600; border:0; border-radius:7px; padding:8px 14px; cursor:pointer; }
  button.sec { background:var(--card); color:var(--tx); border:1px solid var(--line); }
  button.del { background:transparent; color:var(--red); border:1px solid var(--line); padding:4px 10px; }
  .bar { display:flex; gap:10px; margin:12px 0; flex-wrap:wrap; align-items:center; }
  h2, h3 { font-size:17px; } h2 { margin:6px 0 12px; }
  .hint { color:var(--dim); font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>Разметка видео кассира · ForteBank</h1>
  <span>Кто размечает:</span><input id="author" placeholder="имя" style="width:120px">
  <button class="sec" onclick="location.reload()">⟳ перечитать</button>
  <button onclick="exportCSV()">⬇ Скачать ВСЕ аннотации (CSV)</button>
  <button class="sec" onclick="copyCSV()">⧉ Скопировать CSV</button>
  <span class="hint" id="saveInfo"></span>
</header>
<main>
  <div id="list"></div>
  <div id="detail">
    <button class="sec" onclick="showList()">← ко всем видео</button>
    <div class="row" style="margin-top:14px">
      <div class="col" style="max-width:560px">
        <video id="player" controls></video>
        <div class="bar">
          <button onclick="snapTime()">+ событие по времени плеера</button>
          <span class="hint">нажми, когда на паузе — время подставится автоматически</span>
        </div>
      </div>
      <div class="col">
        <img class="strip" id="strip">
        <div class="hint" style="margin-top:6px">лента 1 кадр/сек, полного видео (тут и на картах разметки)</div>
      </div>
    </div>
    <h3>События</h3>
    <div id="events"></div>
    <button onclick="addEvent()">+ добавить событие</button>
  </div>
</main>
<script>
const DATA = [
  {num:1,  file:"X-1.mov",  label:"нарушение",     ts:22},
  {num:2,  file:"X-2.mov",  label:"нарушение",     ts:10},
  {num:3,  file:"Х-3.mov",  label:"без нарушения", ts:null},
  {num:4,  file:"Х-4.mov",  label:"нарушение",     ts:57, dupe:"Х-47"},
  {num:5,  file:"Х-5.mov",  label:"без нарушения", ts:null, dupe:"Х-48"},
  {num:8,  file:"Х-8.mov",  label:"без нарушения", ts:null},
  {num:10, file:"Х-10.mov", label:"без нарушения", ts:null},
  {num:11, file:"Х-11.mov", label:"нарушение",     ts:18},
  {num:12, file:"Х-12.mov", label:"без нарушения", ts:null},
  {num:13, file:"Х-13.mov", label:"нарушение",     ts:47},
  {num:14, file:"Х-14.mov", label:"без нарушения", ts:null},
  {num:15, file:"Х-15.mov", label:"нарушение",     ts:15},
  {num:16, file:"Х-16.mov", label:"без нарушения", ts:null},
  {num:17, file:"Х-17.mov", label:"нарушение",     ts:7},
  {num:18, file:"Х-18.mov", label:"нарушение",     ts:20},
  {num:19, file:"Х-19.mov", label:"без нарушения", ts:null},
  {num:20, file:"Х-20.mov", label:"нарушение",     ts:5},
  {num:21, file:"Х-21.mov", label:"без нарушения", ts:null},
  {num:22, file:"Х-22.mov", label:"нарушение",     ts:14},
  {num:23, file:"Х-23.mov", label:"без нарушения", ts:null},
  {num:24, file:"Х-24.mov", label:"нарушение",     ts:8},
  {num:25, file:"Х-25.mov", label:"без нарушения", ts:null},
  {num:26, file:"Х-26.mov", label:"нарушение",     ts:9},
  {num:27, file:"Х-27.mov", label:"без нарушения", ts:null},
  {num:28, file:"Х-28.mov", label:"нарушение",     ts:7},
  {num:29, file:"Х-29.mov", label:"без нарушения", ts:null},
  {num:30, file:"Х-30.mov", label:"нарушение",     ts:13},
  {num:31, file:"Х-31.mov", label:"без нарушения", ts:null},
  {num:32, file:"Х-32.mov", label:"нарушение",     ts:5},
  {num:33, file:"Х-33.mov", label:"нарушение",     ts:6},
  {num:34, file:"Х-34.mov", label:"нарушение",     ts:13},
  {num:35, file:"Х-35.mov", label:"без нарушения", ts:null},
  {num:37, file:"Х-37.mov", label:"без нарушения", ts:null},
  {num:38, file:"Х-38.mov", label:"нарушение",     ts:33},
  {num:39, file:"Х-39.mov", label:"без нарушения", ts:null},
  {num:40, file:"Х-40.mov", label:"нарушение",     ts:17},
  {num:43, file:"Х-43.mov", label:"без нарушения", ts:null},
  {num:44, file:"Х-44.mov", label:"нарушение",     ts:16},
  {num:45, file:"Х-45.mov", label:"без нарушения", ts:null},
  {num:46, file:"Х-46.mov", label:"нарушение",     ts:11},
  {num:47, file:"Х-47.mov", label:"нарушение",     ts:68, dupe:"Х-4"},
  {num:48, file:"Х-48.mov", label:"без нарушения", ts:null, dupe:"Х-5"},
];

const CATS = [
  "", "деньги пересчитаны/взяты до оформления документов", "деньги в неустановленном месте (стол/незакрытая зона)",
  "приём/выдача инкассации с отклонением от процедуры", "открытый денежный ящик/техника при посторонних",
  "телефон/отвлечение во время операции", "посторонний в кассовой зоне/кассовая зона не защищена",
  "пропуск/дверь: нарушение контроля доступа", "бездействие (не выполнено обязательное действие)",
  "кассир оставляет рабочее место без видимой причины", "непонятно/другое"
];
const VERDICTS = ["", "нарушение", "норма", "непонятно"];

const LKEY = "fortebank_annotations_v1";
let ann = {};
try { ann = JSON.parse(localStorage.getItem(LKEY)) || {}; } catch { ann = {}; }
let cur = null;

const save = () => { try { localStorage.setItem(LKEY, JSON.stringify(ann)); } catch {} };
document.getElementById("author").value = (() => { try { return localStorage.getItem("fortebank_author") || ""; } catch { return ""; } })();
document.getElementById("author").oninput = e => { try { localStorage.setItem("fortebank_author", e.target.value); } catch {} };

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }

function showList(){
  const l = document.getElementById("list");
  l.innerHTML = `<div class="cards">` + DATA.map(d => {
    const evs = (ann[d.file]||[]).length;
    const status = (ann["__status__"+d.file] || "");
    return `<div class="card" onclick="showDetail(${d.num})">
      <div class="num">№${d.num} · ${d.dur||""}с</div>
      <b>${esc(d.file)}</b><br>
      <span class="badge ${d.label==="нарушение"?"viol":"clean"}">${d.label}${d.ts?" @"+d.ts+"с":""}</span><br>
      <span class="done">${evs?("событий: "+evs):""} ${status==="done"?"✓ готово":""}</span>
      ${d.dupe?`<div class="dupe">⧉ дубль ${d.dupe}</div>`:""}
    </div>`;
  }).join("") + `</div>
  <p class="hint" style="margin-top:16px">Порядок просмотра удобнее от коротких нарушений (№20, №32, №33 …) к длинным.
  Аннотируй ВСЕ значимые события, включая «норму» — важно зафиксировать последовательность (что было ДО события).</p>`;
  l.style.display = "block";
  document.getElementById("detail").style.display = "none";
}

function showDetail(num){
  cur = DATA.find(d => d.num === num);
  document.getElementById("list").style.display = "none";
  const det = document.getElementById("detail");
  det.style.display = "block";
  const player = document.getElementById("player");
  player.src = "open/videos/" + encodeURIComponent(cur.file);
  document.getElementById("strip").src = "strips/strip_num" + String(cur.num).padStart(2,"0") + ".png";
  renderEvents();
}

function snapTime(){
  const t = document.getElementById("player").currentTime;
  addEvent(parseFloat(t.toFixed(2)));
}

function renderEvents(){
  const c = document.getElementById("events");
  const evs = ann[cur.file] || (ann[cur.file] = []);
  c.innerHTML = evs.length ? evs.map(evCard).join("")
    : `<p class="hint">пока пусто — добавь событие кнопкой выше</p>`;
  c.querySelectorAll("[data-f]").forEach(inp => {
    inp.onchange = e => {
      const parts = inp.dataset.f.split("_");
      const i = Number(parts[0]); const f = parts.slice(1).join("_");
      if (f === "verdict" || f === "actor") evs[i][f] = inp.selectedOptions[0]?.value ?? evs[i][f];
      else evs[i][f] = inp.value;
      save();
    };
  });
  c.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    evs.splice(Number(b.dataset.del), 1); save(); renderEvents(); });
  document.getElementById("saveInfo").textContent = "всё сохраняется локально в браузере";
}

function evCard(ev, i){
  return `<div class="ev">
    <div style="display:flex; justify-content:space-between; align-items:center">
      <b>событие ${i+1}</b><button class="del" data-del="${i}">удалить</button></div>
    <div style="display:flex; gap:8px">
      <div style="width:110px"><label>таймкод, сек</label><input data-f="${i}_timecode_sec" type="number" step="0.1" value="${esc(ev.timecode_sec)}"></div>
      <div style="flex:1"><label>категория (черновой таксоном, правь свободно)</label>
        <input data-f="${i}_category" list="cats" value="${esc(ev.category)}">
      </div>
      <div style="width:110px"><label>оценка</label>
        <select data-f="${i}_verdict">${VERDICTS.map(v=>`<option ${v===(ev.verdict||"")?"selected":""}>${v}</option>`).join("")}</select>
      </div>
    </div>
    <label>что было ПЕРЕД (контекст 5–10 сек)</label>
    <textarea data-f="${i}_what_before">${esc(ev.what_before)}</textarea>
    <label>что происходит (кто, что, руками чем — конкретно)</label>
    <textarea data-f="${i}_what_happens">${esc(ev.what_happens)}</textarea>
    <div class="grid3" style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
      <div><label>объекты (деньги, чек, папка, сумка…)</label><input data-f="${i}_objects" value="${esc(ev.objects)}"></div>
      <div><label>кто действующее лицо</label>
        <select data-f="${i}_actor"><option value="" ${!ev.actor?"selected":""}></option>${["кассир","клиент","инкассатор","посторонний","оба"].map(a=>`<option ${a===ev.actor?"selected":""}>${a}</option>`).join("")}</select>
      </div>
    </div>
    <label>заметки (двусмысленности, что не видно)</label>
    <input data-f="${i}_notes" value="${esc(ev.notes)}">
  </div>`;
}

function addEvent(t){
  const evs = ann[cur.file] || (ann[cur.file] = []);
  evs.push({ timecode_sec: t != null ? t : "", what_before:"", what_happens:"", objects:"", category:"", verdict:"", actor:"", notes:"" });
  save(); renderEvents();
}

function csvAll(){
  const author = document.getElementById("author").value || "";
  const hd = "filename,num,timecode_sec,what_before,what_happens,objects,category,verdict,actor,author,status";
  const esc2 = s => '"' + String(s==null?"":s).replace(/"/g,'""') + '"';
  let out = [hd];
  DATA.forEach(d => {
    const st = ann["__status__"+d.file] || "";
    (ann[d.file]||[]).forEach(e => out.push([d.file,d.num,e.timecode_sec,e.what_before,e.what_happens,
      e.objects,e.category,e.verdict,e.actor,author,st].map(esc2).join(",")));
  });
  return out.join("\n");
}

function exportCSV(){
  const blob = new Blob(["﻿" + csvAll()], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "annotations.csv";
  a.click();
}
function copyCSV(){
  navigator.clipboard.writeText(csvAll()).then(() => {
    document.getElementById("saveInfo").textContent = "CSV скопирован в буфер";
  });
}

const dl = document.createElement("datalist"); dl.id = "cats";
dl.innerHTML = CATS.map(c=>`<option value="${esc(c)}">`).join("");
document.body.appendChild(dl);

showList();
</script>
</body>
</html>
